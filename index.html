<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Task Manager</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>

            <div>
                <h1>Student Task Manager</h1>

                <p>
                    Organize your academic life efficiently
                </p>
            </div>

            <button id="themeBtn">
                🌙
            </button>

        </header>


        <!-- Add Task Section -->

        <div class="add-task">

            <input
                type="text"
                id="taskInput"
                placeholder="What do you need to do?"
            >

            <select id="priorityInput">

                <option value="High">
                    High Priority
                </option>

                <option value="Medium" selected>
                    Medium Priority
                </option>

                <option value="Low">
                    Low Priority
                </option>

            </select>

            <input
                type="date"
                id="dateInput"
            >

            <button id="addBtn">
                + Add Task
            </button>

        </div>


        <!-- Statistics -->

        <div class="stats">

            <div class="stat-card">

                <h2 id="totalTasks">0</h2>

                <p>Total Tasks</p>

            </div>


            <div class="stat-card">

                <h2 id="completedTasks">0</h2>

                <p>Completed</p>

            </div>


            <div class="stat-card">

                <h2 id="pendingTasks">0</h2>

                <p>Pending</p>

            </div>


            <div class="stat-card">

                <h2 id="highTasks">0</h2>

                <p>High Priority</p>

            </div>

        </div>


        <!-- Progress -->

        <div class="progress-section">

            <div class="progress-header">

                <span>Overall Progress</span>

                <span id="progressText">0%</span>

            </div>

            <div class="progress-bar">

                <div id="progressFill"></div>

            </div>

        </div>


        <!-- Search and Filter -->

        <div class="controls">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search tasks..."
            >


            <select id="filterInput">

                <option value="all">
                    All Tasks
                </option>

                <option value="pending">
                    Pending
                </option>

                <option value="completed">
                    Completed
                </option>

            </select>


            <button id="clearBtn">
                Clear Completed
            </button>

        </div>


        <!-- Task List -->

        <ul id="taskList"></ul>


        <!-- Empty message -->

        <p id="emptyMessage">
            No tasks found. Add your first task!
        </p>


        <!-- Footer -->

        <footer>

            <p>
                Student Task Manager • Built with HTML, CSS & JavaScript
            </p>

        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
